services:
  encomendas-api:
    image: localhost/encomendas-api:local
    build:
      context: ./encomendas-api
    container_name: encomendas-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: encomendas_db
      DB_USER: encomendas
      DB_PASSWORD: encomendas
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - encomendas-network

  encomendas:
    image: localhost/encomendas:local
    build:
      context: ./encomendas
    container_name: encomendas
    ports:
      - "4200:80"
    depends_on:
      - encomendas-api
    networks:
      - encomendas-network

  postgres:
    image: localhost/encomendas-postgres:local
    build:
      context: ./database
    container_name: encomendas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: encomendas_db
      POSTGRES_USER: encomendas
      POSTGRES_PASSWORD: encomendas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - encomendas-network

volumes:
  postgres-data:

networks:
  encomendas-network: